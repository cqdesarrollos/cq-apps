<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROE &amp; TIR · CQ Desarrollos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --verde:#1C3D35;
    --verde-2:#274F45;
    --verde-3:#345E52;
    --sand:#F5F3EF;
    --sand-2:#EAE6DC;
    --card:#FFFFFF;
    --texto:#1C3D35;
    --texto-sub:#6B7A74;
    --borde:rgba(28,61,53,0.12);
    --ok:#3E7D5A;
    --ok-bg:#E7F1EA;
    --warn:#B8843A;
    --warn-bg:#F7EDDB;
    --bad:#A8503F;
    --bad-bg:#F5E4DF;
    --gris:#8E8A80;
    --gris-bg:#EDEBE5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--texto);
    font-family:'Space Grotesk',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--sand);}

  /* Header */
  .topbar{
    background:var(--verde);
    color:var(--sand);
    padding:18px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.2px;}
  .topbar .sub{font-size:11px;color:#B9C7C0;font-family:'JetBrains Mono',monospace;margin-top:2px;}
  .icon-btn{
    background:rgba(245,243,239,0.12);
    border:1px solid rgba(245,243,239,0.25);
    color:var(--sand);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;cursor:pointer;flex-shrink:0;
  }

  /* Tabs */
  .tabs{
    display:flex;gap:6px;padding:10px 14px;background:var(--verde);
    position:sticky;top:62px;z-index:19;
  }
  .tab-btn{
    flex:1;padding:9px 4px;border:none;border-radius:999px;
    background:rgba(245,243,239,0.1);color:#CBD6D1;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--sand);color:var(--verde);}

  main{flex:1;padding:16px 14px 90px;}
  .tab-content{display:none;}
  .tab-content.active{display:block;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  /* Cards */
  .card{
    background:var(--card);
    border:1px solid var(--borde);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:14px;margin:0 0 12px;color:var(--verde);font-weight:700;}
  .card h2 .n{color:var(--texto-sub);font-weight:500;font-size:12px;margin-left:6px;}

  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:11.5px;color:var(--texto-sub);margin-bottom:5px;font-weight:500;
  }
  .field input, .field select{
    width:100%;padding:10px 11px;border:1px solid var(--borde);border-radius:10px;
    font-size:14.5px;font-family:'JetBrains Mono',monospace;color:var(--texto);
    background:var(--sand);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--verde-3);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .hint{font-size:11px;color:var(--texto-sub);margin-top:5px;}

  /* Chips */
  .chip-group{display:flex;gap:8px;}
  .chip{
    flex:1;text-align:center;padding:9px 6px;border-radius:999px;
    border:1px solid var(--borde);background:var(--sand);color:var(--texto-sub);
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .chip.active{background:var(--verde);color:var(--sand);border-color:var(--verde);}

  /* Cost rows */
  .cost-row{display:grid;grid-template-columns:70px 1fr 30px;gap:8px;align-items:center;margin-bottom:8px;}
  .cost-row input{padding:8px 9px;}
  .row-del{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--bad-bg);
    color:var(--bad);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .add-row-btn{
    width:100%;padding:9px;border:1.5px dashed var(--borde);border-radius:10px;
    background:transparent;color:var(--verde-3);font-weight:600;font-size:13px;cursor:pointer;
    margin-top:2px;
  }
  .total-line{
    display:flex;justify-content:space-between;font-size:12.5px;margin-top:10px;
    padding-top:10px;border-top:1px dashed var(--borde);color:var(--texto-sub);
  }
  .total-line b{color:var(--texto);font-family:'JetBrains Mono',monospace;}
  .total-line.warn b{color:var(--warn);}

  /* Buttons */
  .btn-primary{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--verde);color:var(--sand);font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:'Space Grotesk',sans-serif;
  }
  .btn-secondary{
    width:100%;padding:12px;border:1px solid var(--verde);border-radius:12px;
    background:transparent;color:var(--verde);font-weight:600;font-size:13.5px;
    cursor:pointer;margin-top:8px;font-family:'Space Grotesk',sans-serif;
  }

  /* KPI badges */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .kpi{
    border-radius:12px;padding:10px 12px;border:1px solid var(--borde);
  }
  .kpi .label{font-size:10.5px;color:var(--texto-sub);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;margin-top:2px;}
  .kpi .band{font-size:11px;margin-top:3px;font-weight:600;}
  .kpi.green{background:var(--ok-bg);} .kpi.green .value, .kpi.green .band{color:var(--ok);}
  .kpi.yellow{background:var(--warn-bg);} .kpi.yellow .value, .kpi.yellow .band{color:var(--warn);}
  .kpi.red{background:var(--bad-bg);} .kpi.red .value, .kpi.red .band{color:var(--bad);}
  .kpi.gray{background:var(--gris-bg);} .kpi.gray .value, .kpi.gray .band{color:var(--gris);}

  .res-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--borde);}
  .res-line:last-child{border-bottom:none;}
  .res-line .v{font-family:'JetBrains Mono',monospace;font-weight:600;}
  .res-line.ganancia .v{color:var(--ok);font-weight:700;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
    font-size:12px;font-weight:700;
  }
  .badge.green{background:var(--ok-bg);color:var(--ok);}
  .badge.yellow{background:var(--warn-bg);color:var(--warn);}
  .badge.red{background:var(--bad-bg);color:var(--bad);}
  .badge.gray{background:var(--gris-bg);color:var(--gris);}

  .cell-green{color:var(--ok);font-weight:700;}
  .cell-yellow{color:var(--warn);font-weight:700;}
  .cell-red{color:var(--bad);font-weight:700;}
  .cell-gray{color:var(--gris);font-weight:600;}

  /* Flujo table */
  .flujo-toggle{
    text-align:center;font-size:12.5px;color:var(--verde-3);font-weight:600;cursor:pointer;padding:4px 0;
  }
  .table-wrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse;width:100%;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  table th, table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--borde);white-space:nowrap;}
  table th{color:var(--texto-sub);font-weight:600;text-align:right;position:sticky;top:0;background:var(--card);}
  table td:first-child, table th:first-child{text-align:left;}
  table tr.neg td{color:var(--bad);}

  /* Obras list */
  .obra-card{
    background:var(--card);border:1px solid var(--borde);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .obra-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .obra-nombre{font-weight:700;font-size:15px;}
  .obra-stats{display:flex;gap:14px;margin-top:8px;font-size:12px;}
  .obra-stats .s b{display:block;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--texto);}
  .obra-stats .s span{color:var(--texto-sub);font-size:10.5px;}
  .obra-actions{display:flex;gap:8px;margin-top:10px;}
  .obra-actions button{
    flex:1;padding:8px;border-radius:9px;border:1px solid var(--borde);background:var(--sand);
    font-size:12px;font-weight:600;color:var(--verde);cursor:pointer;
  }
  .obra-actions button.del{color:var(--bad);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--texto-sub);
  }
  .empty-state .ic{font-size:34px;margin-bottom:10px;}
  .empty-state p{font-size:13.5px;margin:0;line-height:1.5;}

  /* Comparar */
  .compare-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .pick-chip{
    padding:8px 13px;border-radius:999px;border:1px solid var(--borde);background:var(--card);
    font-size:12.5px;font-weight:600;color:var(--texto-sub);cursor:pointer;
  }
  .pick-chip.active{background:var(--verde);color:var(--sand);border-color:var(--verde);}
  .compare-table{margin-top:6px;}
  .compare-table th{font-family:'Space Grotesk',sans-serif;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,61,53,0.5);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--sand);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:20px;max-height:82vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-size:16px;color:var(--verde);}
  .modal .close{
    float:right;background:none;border:none;font-size:20px;color:var(--texto-sub);cursor:pointer;
  }
  .leg-block{margin-top:16px;}
  .leg-block h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-sub);margin:0 0 6px;}
  .leg-item{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--borde);}
  .leg-item span:last-child{font-family:'JetBrains Mono',monospace;font-weight:600;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--verde);color:var(--sand);padding:11px 20px;border-radius:999px;
    font-size:13px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>

<script>
/* ============================ ESTADO ============================ */
const STORAGE_KEY = 'cq_roetir_obras';
let obras = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
migrarObras();
function migrarObras(){
  let changed = false;
  obras.forEach(o=>{
    if(!o.costos){
      o.costos = repartoParejo(o.costoTotal, o.mes0).map(c=>({...c,manual:true}));
      changed = true;
    } else {
      o.costos.forEach(c=>{
        if(c.manual===undefined){
          c.manual = Math.abs(Number(c.monto)||0) > 0.000001;
          changed=true;
        }
        if(c.manual && Math.abs(Number(c.monto)||0) <= 0.000001){
          c.manual=false;
          changed=true;
        }
      });
    }
    (o.unidades||[]).forEach(u=>{
      // CQ: desde esta versión, Terminada también usa plan de pagos.
      // Si una obra histórica tenía solo "mesCobro", convertirla en una cuota única.
      if(u.tipo==='Terminada'){
        if(!Array.isArray(u.cuotas)) u.cuotas=[];
        const tienePagosReales=u.cuotas.some(c=>(Number(c.monto)||0)>0);
        if(!tienePagosReales && Number(u.precio||0)>0){
          u.cuotas=[{
            mes:Number(u.mesCobro)||0,
            monto:Number(u.precio)||0
          }];
          changed=true;
        }
      }

      if(u.comisionPct===undefined){
        u.comisionPct = (o.comisionPct!=null ? o.comisionPct : 2.5);
        changed = true;
      }

      if(u.tipo==='Pozo' && !u.cuotas){
        const cant = Number(u.cantCuotas||0);
        const m1 = Number(u.mes1raCuota||0);
        const val = cant>0 ? (Number(u.precio||0)-Number(u.anticipo||0))/cant : 0;
        u.cuotas = [];
        for(let k=0;k<cant;k++) u.cuotas.push({mes:m1+k, monto:val});
        changed = true;
      }

      if(u.tipo==='Pozo' && !u._cqAnticipoMigrado){
        const ant=Number(u.anticipo||0);
        if(ant>0){
          const mesAnt=Number(u.mesVenta)||0;
          const existente=(u.cuotas||[]).find(c=>(Number(c.mes)||0)===mesAnt);
          if(existente) existente.monto=Number(existente.monto||0)+ant;
          else (u.cuotas||(u.cuotas=[])).unshift({mes:mesAnt,monto:ant});
        }
        u.anticipo=0;
        u._cqAnticipoMigrado=true;
        changed=true;
      }

      if(Array.isArray(u.cuotas) && u.cuotas.length>36){
        u.cuotas=u.cuotas.slice(0,36);
        changed=true;
      }

      actualizarMesComisionUnidad(u);
    });
  });
  if(changed) saveStorage();
}
let editingId = null;
let comparePicked = [];

function unidadDefault(){
  return {
    tipo:'Pozo',
    precio:0,
    comisionPct:2.5,
    cuotas:[],
    mesCobro:1,
    comisionMes:0
  };
}

let draft = {
  nombre:'', costoTotal:0, costos:[{mes:0, monto:0, manual:false}],
  unidades:[ unidadDefault(), unidadDefault() ]
};

/* ============================ UTILS ============================ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ if(n==null||isNaN(n)) return '—'; return '$'+Math.round(n).toLocaleString('es-AR'); }
function fmtPct(n){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return (n*100).toFixed(1)+'%'; }
function fmtNum(n,d=0){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return Number(n).toFixed(d).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,''); }
function fmtMes(n){ if(n==null) return '—'; return n+(n===1?' mes':' meses'); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
let __cqRoeApplyingRemote=false;
function cqRoeSnapshot(){
  return {obras:JSON.parse(JSON.stringify(obras||[]))};
}
function saveStorage(){

/* ============================ MOTOR DE CÁLCULO ============================ */
function repartoParejo(costoTotal, mes0){
  const total = Number(costoTotal||0), m0 = Number(mes0||0);
  const resto = Math.max(total - m0, 0);
  const porMes = Math.round(resto/7);
  const arr = [{mes:0, monto:m0}];
  for(let m=1;m<=7;m++) arr.push({mes:m, monto:porMes});
  return arr;
}

function computeFlujo(esc){
  const costosArr = esc.costos || [];
  let maxMes = 0;

  costosArr.forEach(c=>{
    maxMes=Math.max(maxMes, Number(c.mes)||0);
  });

  esc.unidades.forEach(u=>{
    actualizarMesComisionUnidad(u);
    const cuotaMeses=(u.cuotas||[]).map(c=>Number(c.mes)||0);
    maxMes=Math.max(maxMes, ...(cuotaMeses.length?cuotaMeses:[0]));
    maxMes=Math.max(maxMes, Number(u.comisionMes)||0);
  });

  const costoMap = {};
  costosArr.forEach(c=>{
    const mes=Number(c.mes)||0;
    costoMap[mes]=(costoMap[mes]||0)+Number(c.monto||0);
  });

  const flujo=[]; let acumulado=0;

  for(let m=0;m<=maxMes;m++){
    const costoProyecto = costoMap[m]||0;
    let ingresos=[0,0], comisiones=[0,0];

    esc.unidades.forEach((u,idx)=>{
      const cs=(u.cuotas||[]).filter(c=>(Number(c.mes)||0)===m);
      const ingreso=cs.reduce((a,c)=>a+Number(c.monto||0),0);

      const comision=(m===(Number(u.comisionMes)||0) && Number(u.comisionMes)>0)
        ? Number(u.precio||0)*(Number(u.comisionPct||0)/100)
        : 0;

      ingresos[idx]=ingreso;
      comisiones[idx]=comision;
    });

    const flujoNeto=
      ingresos[0]+ingresos[1]
      -costoProyecto
      -comisiones[0]-comisiones[1];

    acumulado += flujoNeto;

    flujo.push({
      mes:m,
      costoProyecto,
      ingresoU1:ingresos[0],
      comisionU1:comisiones[0],
      ingresoU2:ingresos[1],
      comisionU2:comisiones[1],
      flujoNeto,
      acumulado
    });
  }

  return flujo;
}

function npv(rate, flows){
  let s=0;
  for(let t=0;t<flows.length;t++) s += flows[t]/Math.pow(1+rate,t);
  return s;
}
function irr(flows){
  // TIR robusta: busca cambios de signo de VAN en varios tramos.
  // Esto evita que algunas obras queden "sin datos" cuando el flujo tiene varios cambios de signo
  // o cuando la raíz no queda encerrada entre -99% y 5000% en el primer intento.
  const clean = (flows||[]).map(f=>Number(f)||0);
  const hasPos = clean.some(f=>f>0), hasNeg = clean.some(f=>f<0);
  if(!hasPos || !hasNeg) return null;

  function bisect(lo, hi){
    let fLo=npv(lo,clean), fHi=npv(hi,clean);
    if(!isFinite(fLo) || !isFinite(fHi) || fLo*fHi>0) return null;
    for(let i=0;i<180;i++){
      const mid=(lo+hi)/2, fMid=npv(mid,clean);
      if(!isFinite(fMid)) return null;
      if(Math.abs(fMid)<1e-7) return mid;
      if((fLo<0 && fMid<0)||(fLo>0 && fMid>0)){ lo=mid; fLo=fMid; }
      else { hi=mid; fHi=fMid; }
    }
    return (lo+hi)/2;
  }

  // Escaneo fino en tasas mensuales razonables: -99% a 300% mensual.
  // Incluye muchos casos reales sin forzar resultados absurdos.
  let roots=[];
  let prevR=-0.99, prevV=npv(prevR,clean);
  const steps=1200, maxR=3;
  for(let i=1;i<=steps;i++){
    const r = -0.99 + (maxR+0.99)*i/steps;
    const v = npv(r,clean);
    if(!isFinite(prevV) || !isFinite(v)){ prevR=r; prevV=v; continue; }
    if(Math.abs(v)<1e-7){ roots.push(r); }
    else if(prevV*v<0){
      const root=bisect(prevR,r);
      if(root!=null && isFinite(root)) roots.push(root);
    }
    prevR=r; prevV=v;
  }
  if(!roots.length) return null;

  // Si hay más de una raíz, usamos la positiva más baja; si no, la mayor negativa.
  const positivas = roots.filter(r=>r>=0).sort((a,b)=>a-b);
  if(positivas.length) return positivas[0];
  return roots.sort((a,b)=>b-a)[0];
}

function computeResultados(esc){
  const flujo = computeFlujo(esc);
  const ingresoTotal = flujo.reduce((a,f)=>a+f.ingresoU1+f.ingresoU2,0);
  const comisionTotal = flujo.reduce((a,f)=>a+f.comisionU1+f.comisionU2,0);
  const costoTotal = flujo.reduce((a,f)=>a+f.costoProyecto,0);
  const ganancia = ingresoTotal - comisionTotal - costoTotal;
  const acumulados = flujo.map(f=>f.acumulado);
  const capitalMaximo = -Math.min(0, Math.min(...acumulados));
  const roe = capitalMaximo>0 ? ganancia/capitalMaximo : null;
  const tirMensual = irr(flujo.map(f=>f.flujoNeto));
  const tirAnual = tirMensual!=null ? Math.pow(1+tirMensual,12)-1 : null;
  let payback = null;
  for(let i=0;i<acumulados.length;i++){ if(acumulados[i]>=0){ payback=i; break; } }
  const capitalCosto = costoTotal>0 ? capitalMaximo/costoTotal : null;
  return { flujo, ingresoTotal, comisionTotal, costoTotal, ganancia, capitalMaximo, roe, tirMensual, tirAnual, payback, capitalCosto };
}

function decision(r){
  if(r.tirAnual==null || r.roe==null) return {color:'gray', label:'SIN DATOS', desc:'completá los dos escenarios para comparar'};
  const tir = r.tirAnual*100, roe = r.roe*100, cap = r.capitalMaximo;
  if(tir>120 && roe>70 && cap<80000) return {color:'green', label:'IR A POZO', desc:'Bajar precio si hace falta · acelerar ventas · maximizar rotación'};
  if(tir>=60 && tir<=120 && roe>=60 && roe<=100 && cap>=60000 && cap<=100000) return {color:'yellow', label:'MANTENER', desc:'Equilibrio · riesgo controlado · negocio estable'};
  if(tir<60 && roe<60 && cap>100000) return {color:'red', label:'NO FORZAR', desc:'Vender terminado · no bajar precio de más · cuidar margen'};
  return {color:'gray', label:'MIXTO', desc:'No cumple todas las condiciones de una regla — evaluar caso a caso'};
}

    .sort((a,b)=>(Number(a.mes)||0)-(Number(b.mes)||0));

  return cuotasConPago.length ? (Number(cuotasConPago[0].mes)||0) : 0;
}

/* ============================ RENDER: COSTOS ============================ */
function renderCostos(){
  const wrap = document.getElementById('costos-rows');
  if(!wrap) return;
  wrap.innerHTML = draft.costos.map((c,i)=>`
    <div class="cost-row ${c.manual?'manual-cost':'auto-cost'}" data-cost-row="${i}">
      <input type="number" step="1" value="${Math.round(Number(c.mes)||0)}" onchange="updateCostoMes(${i}, this.value)" placeholder="Mes">
      <input type="number" step="1" value="${Math.round(Number(c.monto)||0)}"
        oninput="updateCostoMonto(${i}, this.value, this)"
        onblur="finalizarCostoMonto(${i})"
        placeholder="Monto $">
      <button class="row-del" onclick="delCostoRow(${i})">✕</button>
    </div>
  `).join('');
  cqActualizarResumenCostos();
}
function addCostoRow(){
  const maxMes = draft.costos.length ? Math.max(...draft.costos.map(c=>Number(c.mes)||0)) : -1;
  draft.costos.push({mes:maxMes+1, monto:0, manual:false});
  cqRepartirCostosAutomatico();
  recalc();
}
function finalizarCostoMonto(i){
  if(!draft.costos[i]) return;
  if(Math.abs(Number(draft.costos[i].monto)||0) <= 0.000001){
    draft.costos[i].manual=false;
    cqRepartirCostosAutomatico();
  }
  renderCostos();
  recalc(true);
}

function delCostoRow(i){
  draft.costos.splice(i,1);
  if(!draft.costos.length){
    draft.costos.push({mes:0,monto:0,manual:false});
  }
  cqRepartirCostosAutomatico();
  recalc();
}
function updateCostoMes(i,v){
  draft.costos[i].mes = Number(v)||0;
  recalc();
}
function updateCostoMonto(i,v,inputEl){
  if(!draft.costos[i]) return;

  const valor = Math.max(0, Number(v)||0);
  draft.costos[i].monto = valor;
  draft.costos[i].manual = valor > 0;

  // Los meses anteriores con importe ya cargado quedan fijos.
  for(let k=0;k<i;k++){
    if(Math.abs(Number(draft.costos[k].monto)||0) > 0.000001){
      draft.costos[k].manual = true;
    }
  }

  cqRepartirCostosAutomatico();

  // Actualiza solamente los otros inputs; el activo no se reemplaza.
  cqActualizarCostosEnPantalla(i);

  // Recalcula resultados sin reconstruir los campos de costos.
  recalc(true);
}

function cqActualizarResumenCostos(){
  const count=document.getElementById('costos-count');
  if(count) count.textContent='('+draft.costos.length+')';
  const total=draft.costos.reduce((a,c)=>a+Number(c.monto||0),0);
  const totalEl=document.getElementById('costos-total');
  if(totalEl) totalEl.textContent=fmtMoney(total);
  const line=document.getElementById('costos-total-line');
  if(line) line.classList.toggle('warn', draft.costoTotal>0 && Math.abs(total-draft.costoTotal)>1);
}

function cqActualizarCostosEnPantalla(exceptIndex){
  document.querySelectorAll('#costos-rows .cost-row').forEach((row)=>{
    const i=Number(row.dataset.costRow);
    const c=draft.costos[i];
    if(!c)return;
    row.classList.toggle('manual-cost',!!c.manual);
    row.classList.toggle('auto-cost',!c.manual);
    const inputs=row.querySelectorAll('input');
    if(inputs[0] && document.activeElement!==inputs[0]) inputs[0].value=c.mes;
    if(inputs[1] && i!==exceptIndex && document.activeElement!==inputs[1]) inputs[1].value=c.monto;
  });
  cqActualizarResumenCostos();
}

function cqRedondearCosto(n){
  return Math.round(Number(n)||0);
}

function cqRepartirCostosAutomatico(){
  if(!Array.isArray(draft.costos) || !draft.costos.length) return;

  const total = Math.max(0, Math.round(Number(draft.costoTotal)||0));

  draft.costos.forEach(c=>{
    if(c.manual && Math.abs(Number(c.monto)||0) <= 0.000001) c.manual=false;
  });

  const fijos = draft.costos.filter(c=>c.manual);
  const automaticos = draft.costos.filter(c=>!c.manual);

  const fijoTotal = fijos.reduce((a,c)=>a+Math.round(Number(c.monto)||0),0);
  const saldo = Math.max(0, total - fijoTotal);

  if(!automaticos.length) return;

  const base = Math.floor(saldo / automaticos.length);
  let asignado = 0;

  automaticos.forEach((c,idx)=>{
    if(idx === automaticos.length-1){
      c.monto = saldo - asignado;
    }else{
      c.monto = base;
      asignado += base;
    }
  });
}

        <div class="kpi ${bTM.color}"><div class="label">TIR mensual</div><div class="value">${fmtPct(r.tirMensual)}</div><div class="band">${bTM.label}</div></div>

/* ============================ GUARDAR / CARGAR / LIMPIAR ============================ */
function syncFormToDraft(){
  draft.nombre = document.getElementById('f-nombre').value.trim();
  draft.costoTotal = Number(document.getElementById('f-costoTotal').value)||0;
}
document.getElementById('f-nombre').addEventListener('input', ()=>{
  syncFormToDraft();
  recalc();
});
document.getElementById('f-costoTotal').addEventListener('input', ()=>{
  syncFormToDraft();
  cqRepartirCostosAutomatico();
  cqActualizarCostosEnPantalla(-1);
  recalc(true);
});

function guardarObra(){
  syncFormToDraft();
  if(!draft.nombre){ toast('Poné un código de obra'); return; }
  const esc = JSON.parse(JSON.stringify(draft));
  if(editingId){
    const i = obras.findIndex(o=>o.id===editingId);
    if(i>-1) obras[i] = {...obras[i], ...esc, updatedAt:Date.now()};
  } else {
    obras.push({...esc, id:uid(), createdAt:Date.now(), updatedAt:Date.now()});
  }
  saveStorage();
  toast('Obra guardada');
  limpiarForm();
  document.querySelector('.tab-btn[data-tab="obras"]').click();
}

function limpiarForm(){
  editingId = null;
  draft = { nombre:'', costoTotal:0, costos:[{mes:0, monto:0, manual:false}], unidades:[ unidadDefault(), unidadDefault() ] };
  document.getElementById('f-nombre').value='';
  document.getElementById('f-costoTotal').value='';
  flujoVisible=false;
  renderCostos(); renderUnidad(0); renderUnidad(1); recalc();
}

function cargarObra(id){
  const o = obras.find(x=>x.id===id);
  if(!o) return;
  editingId = id;
  draft = JSON.parse(JSON.stringify(o));
  (draft.costos||[]).forEach(c=>{
    if(c.manual===undefined) c.manual = Math.abs(Number(c.monto)||0) > 0.000001;
    if(c.manual && Math.abs(Number(c.monto)||0) <= 0.000001) c.manual=false;
  });
  cqRepartirCostosAutomatico();
  document.getElementById('f-nombre').value = draft.nombre;
  document.getElementById('f-costoTotal').value = draft.costoTotal || '';
  renderCostos(); renderUnidad(0); renderUnidad(1); recalc();
  document.querySelector('.tab-btn[data-tab="calc"]').click();
}

function duplicarObra(id){
  const o = obras.find(x=>x.id===id);
  if(!o) return;
  const copia = JSON.parse(JSON.stringify(o));
  copia.id = uid(); copia.nombre = o.nombre + ' (copia)'; copia.createdAt = Date.now(); copia.updatedAt = Date.now();
  obras.push(copia); saveStorage(); renderObras();
  toast('Obra duplicada');
}

function eliminarObra(id){
  if(!confirm('¿Eliminar esta obra?')) return;
  obras = obras.filter(o=>o.id!==id);
  saveStorage(); renderObras();
}

function exportarDatos(){
  const blob = new Blob([JSON.stringify(obras, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `obras_roe_tir_${fecha}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importarDatos(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('formato inválido');
      const reemplazar = obras.length===0 || confirm('¿Reemplazar las obras actuales por las importadas?\n\nAceptar = reemplazar todo.\nCancelar = combinar con las que ya tenés.');
      if(reemplazar){
        obras = data;
      } else {
        data.forEach(o=>{
          if(obras.find(x=>x.id===o.id)) o = {...o, id:uid()};
          obras.push(o);
        });
      }
      migrarObras();
      saveStorage();
      renderObras();
      toast('Datos importados');
    }catch(err){
      toast('El archivo no es un JSON válido de esta app');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function cqTipoUnidadDot(u){
  return (u&&u.tipo==='Terminada')?'terminada':'pozo';
}

function cqObrasOrdenadas(){
  let arr=obras.slice();

  if(cqObrasFiltroTipo!=='todos'){
    arr=arr.filter(o=>{
      const us=o.unidades||[];
      const tipos=us.map(u=>(u&&u.tipo==='Terminada')?'terminada':'pozo');
      const terminadas=tipos.filter(t=>t==='terminada').length;
      const pozo=tipos.filter(t=>t==='pozo').length;

      if(cqObrasFiltroTipo==='2terminadas') return terminadas===2;
      if(cqObrasFiltroTipo==='2pozo') return pozo===2;
      if(cqObrasFiltroTipo==='mixto') return terminadas===1 && pozo===1;
      return true;
    });
  }

  if(cqObrasOrden==='nombre'){
    arr.sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{numeric:true,sensitivity:'base'}));
  }else if(cqObrasOrden==='ganancia'){
    arr.sort((a,b)=>(computeResultados(b).ganancia||0)-(computeResultados(a).ganancia||0));
  }else if(cqObrasOrden==='roe'){
    arr.sort((a,b)=>(computeResultados(b).roe||-999)-(computeResultados(a).roe||-999));
  }else{
    arr.sort((a,b)=>(Number(b.updatedAt||b.createdAt)||0)-(Number(a.updatedAt||a.createdAt)||0));
  }
  return arr;
}

let cqCompareOrden='nombre';

function cqCompareTipoMeta(o){
  const us=(o&&o.unidades)||[];
  const terminadas=us.filter(u=>u&&u.tipo==='Terminada').length;
  const pozo=us.filter(u=>!u||u.tipo!=='Terminada').length;

  if(terminadas===2){
    return {key:'2terminadas',label:'2 terminadas',dots:['terminada','terminada']};
  }
  if(pozo===2){
    return {key:'2pozo',label:'2 en pozo',dots:['pozo','pozo']};
  }
  return {key:'mixto',label:'1 + 1',dots:['pozo','terminada']};
}

function cqCompareOrdenadas(base){
  const arr=(base||obras).slice();
  if(cqCompareOrden==='ganancia'){
    arr.sort((a,b)=>(computeResultados(b).ganancia||0)-(computeResultados(a).ganancia||0));
  }else if(cqCompareOrden==='roe'){
    arr.sort((a,b)=>(computeResultados(b).roe||-999)-(computeResultados(a).roe||-999));
  }else if(cqCompareOrden==='tir'){
    arr.sort((a,b)=>(computeResultados(b).tirAnual||-999)-(computeResultados(a).tirAnual||-999));
  }else if(cqCompareOrden==='recientes'){
    arr.sort((a,b)=>(Number(b.updatedAt||b.createdAt)||0)-(Number(a.updatedAt||a.createdAt)||0));
  }else{
    arr.sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{numeric:true,sensitivity:'base'}));
  }
  return arr;
}

function cqCompareOrderLabel(){

let cqChartOrdenDesc = true;

function cqOrdenarDatosGrafico(datos){
  const def = INDICADORES_CHART[chartIndicador];
  return (datos||[]).slice().sort((a,b)=>{
    const av = def && def.get ? def.get(a.r) : null;
    const bv = def && def.get ? def.get(b.r) : null;

    const aOk = av!==null && av!==undefined && isFinite(Number(av));
    const bOk = bv!==null && bv!==undefined && isFinite(Number(bv));

    if(!aOk && !bOk) return String(a.o.nombre||'').localeCompare(String(b.o.nombre||''),'es',{numeric:true});
    if(!aOk) return 1;
    if(!bOk) return -1;

    const diff = Number(av)-Number(bv);
    return cqChartOrdenDesc ? -diff : diff;
  });
}

  cqChartOrdenDesc = !cqChartOrdenDesc;

<script type="module" id="cq-gerencia-only-script">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyAf7vM8Og4jSe7QGHQUK-afvuXka9MCKU8",authDomain:"cq-mano-de-obra.firebaseapp.com",projectId:"cq-mano-de-obra",storageBucket:"cq-mano-de-obra.firebasestorage.app",messagingSenderId:"502127540211",appId:"1:502127540211:web:8daefc75bdaafad412c486"};
const app=getApps().length?getApp():initializeApp(cfg);
const auth=getAuth(app),db=getFirestore(app);
const CACHE_KEY="cq_auth_profile_1h", TTL=3600000;
const map={"emilio@cqgerencia.com": "emilio", "juan@cqgerencia.com": "juan"};
const box=document.getElementById("cq-gerencia-only"),msg=document.getElementById("cq-gerencia-only-msg"),back=document.getElementById("cq-gerencia-only-back");

function readCache(){
 try{
   const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
   if(!c) return null;
   const age=Date.now()-(Number(c.validadoEn)||0);
   if(age<0 || age>TTL) return null;
   return c;
 }catch(e){return null}
}
function clearCache(){
 try{localStorage.removeItem(CACHE_KEY)}catch(e){}
 document.documentElement.classList.remove("cq-fast-1h-roe-tir");
}
function deny(t){
 clearCache();
 if(box){box.classList.remove("ok");box.classList.remove("hidden");box.style.display="flex"}
 if(msg)msg.textContent=t;
 if(back)back.style.display="inline-block";
}
function expose(profile){
 window._cqAuthProfile=profile;
 window._cqUsuarioActual=profile.nombre;
 try{localStorage.setItem("cq_usuario_actual",profile.nombre)}catch(e){}
 document.documentElement.classList.add("cq-fast-1h-roe-tir");
 if(box){box.classList.add("ok");box.classList.add("hidden");box.style.display="none"}
 document.dispatchEvent(new CustomEvent("cq-auth-ready",{detail:profile}));
}
function fromCache(c,email){
 const mods=Array.isArray(c.modulos)?c.modulos:[];
 const ger=mods.includes("gerencia");
 if(String(c.email||"").toLowerCase()!==email) return false;
 if(!(ger)) return false;
 expose({id:map[email]||c.id||"",nombre:c.nombre||"",email:email,modulos:mods,rol:ger?"gerencia":"operaciones"});
 return true;
}
function saveAndExpose(d,user,key){
 const mods=Array.isArray(d.modulos)?d.modulos:[];
 const ger=mods.includes("gerencia");
 const profile={id:key,nombre:d.nombre||key,email:user.email,modulos:mods,rol:ger?"gerencia":"operaciones"};
 try{localStorage.setItem(CACHE_KEY,JSON.stringify({id:key,nombre:profile.nombre,email:String(user.email||"").toLowerCase(),modulos:mods,rol:profile.rol,validadoEn:Date.now()}))}catch(e){}
 expose(profile);
}

onAuthStateChanged(auth,async user=>{
 if(!user){deny("No hay una sesi\u00f3n de Gerencia iniciada.");return}
 try{
   const email=String(user.email||"").toLowerCase(), key=map[email];
   if(!key){deny("Este usuario no tiene acceso a Gerencia.");return}

   const cached=readCache();
   if(cached && fromCache(cached,email)) return;

   const snap=await getDoc(doc(db,"cq_operaciones_usuarios",key));
   if(!snap.exists()){deny("No se encontr\u00f3 la autorizaci\u00f3n de Gerencia.");return}
   const d=snap.data()||{}, mods=Array.isArray(d.modulos)?d.modulos:[];
   const ger=mods.includes("gerencia");

const db=getFirestore(app);
const ref=doc(db,"cq_gerencia_datos","roe_tir");
let unsub=null, started=false, writing=false, remoteLoaded=false;

function status(txt,cls=""){

  if(!el){
    el=document.createElement("div");el.id="cq-roe-fb-status";el.className="cq-fb-shared";

  }

}

window.__cqRoeFirebaseSave=async function(snapshot){

};

    },e=>{console.warn(e);status("Firebase · error","err")});

  }catch(e){console.warn("ROE/TIR Firebase",e);status("Firebase · error","err")}
}

<script id="cq-roe-undo-runtime">
(function(){
  "use strict";
  var KEY="cq_roetir_undo_v1";
  window.__cqRoeUndoRestoring=false;

  window.cqRoeUpdateUndoBtn=function(){
    var b=document.getElementById("cqRoeUndoBtn");
    if(!b)return;
    var has=false;
    try{has=!!localStorage.getItem(KEY);}catch(e){}
    b.disabled=window.__cqRoeUndoRestoring||!has;
  };

  window.cqRoeUndo=async function(){
    if(window.__cqRoeUndoRestoring)return;
    var raw=null,prev=null;
    try{
      raw=localStorage.getItem(KEY);
      if(raw)prev=JSON.parse(raw);
    }catch(e){}
    if(!Array.isArray(prev)){
      window.cqRoeUpdateUndoBtn();
      return;
    }

    window.__cqRoeUndoRestoring=true;
    window.cqRoeUpdateUndoBtn();
    try{
      obras=JSON.parse(JSON.stringify(prev));
      if(typeof migrarObras==="function")migrarObras();

      // Guardar la restauración localmente y en el mismo Firebase que ya usa ROE/TIR.
      if(typeof saveStorage==="function")saveStorage();

      localStorage.removeItem(KEY);

      if(typeof renderObras==="function")renderObras();
      if(typeof renderCompare==="function")renderCompare();
      if(typeof renderComparePick==="function")renderComparePick();
      if(typeof toast==="function")toast("↶ Último cambio deshecho");
    }catch(e){
      console.warn("ROE/TIR: no se pudo deshacer",e);
      alert("No se pudo deshacer el último cambio.");
    }finally{
      window.__cqRoeUndoRestoring=false;
      window.cqRoeUpdateUndoBtn();
    }
  };

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",window.cqRoeUpdateUndoBtn,{once:true});
  }else{
    window.cqRoeUpdateUndoBtn();
  }
})();
</script>
